{% extends "base.html" %}
{% block content %}
<h1>Your Cart 🛒</h1>
{% if items %}
<table>
<tr><th>Item</th><th>Qty</th><th>Price</th><th></th></tr>
{% for i in items %}
<tr><td>{{ i.name }}<br><small>{{ i.note }}</small></td><td>{{ i.qty }}</td>
<td>₹{{ i.price * i.qty }}</td><td><a href="/remove/{{ loop.index0 }}">❌</a></td></tr>
{% endfor %}
</table>
<h2>Total: ₹{{ total }}</h2>
<a class="btn" href="/checkout">Checkout</a>
{% else %}<p>Cart khali che. <a href="/">Shop karo</a></p>{% endif %}
{% endblock %}
